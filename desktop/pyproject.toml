[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-speech-desk"
version = "1.0.0"
description = "Local Windows speech assistant and reusable transcription service"
requires-python = ">=3.10"
dependencies = ["websocket-client>=1.8,<2"]

[project.optional-dependencies]
desktop = ["sounddevice>=0.5,<0.6", "keyboard==0.13.5"]

[project.scripts]
speech-desk = "local_asr.main:main"

[tool.setuptools.packages.find]
where = ["src"]
